name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: LotCodesBarres-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK sur la branche apk
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/LotCodesBarres.apk
          cp build.log /tmp/out/build.log
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Publier le journal d'erreur
        if: failure()
        run: |
          mkdir -p /tmp/err && cp build.log /tmp/err/build.log || echo "pas de journal" > /tmp/err/build.log
          cd /tmp/err
          git init -q -b build-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Échec ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-log
